spring.application.name=simplifica
server.port=${PORT:8080}

# Anthropic — defina ANTHROPIC_API_KEY no ambiente (Railway, .env, etc.)
anthropic.api-key=${ANTHROPIC_API_KEY}

# CORS — em produção troque "*" pelo domínio do frontend (ex.: https://simplifica.vercel.app)
cors.allowed-origins=*

# Erros legíveis no body da resposta
server.error.include-message=always
server.error.include-binding-errors=always

# Upload de arquivos (PDF/DOCX)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Database — PostgreSQL (Spring Boot auto-detects DATABASE_URL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/simplifica}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate - Lazy init to avoid startup DB connection
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# JWT
jwt.secret=${JWT_SECRET:simplifica-super-secret-key-change-in-production-minimum-32-chars-for-production}
jwt.expiration=${JWT_EXPIRATION:86400000}
